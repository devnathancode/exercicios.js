<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verificar numero maior ou menor</title>
</head>
<body>
    <script>
        let num1 = 20
        let num2 = 28

        if (num1 >= num2) {
            alert('o primeiro numero e maior que o segundo')
        } else {
            alert('o segundo numero e maior que o primeiro')
        }
    </script>
</body>
</html>
