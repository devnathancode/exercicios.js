<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mostrando numero do multiplo de 3 ate 100</title>
</head>
<body>
    <script>

        for(let i = 3; i <= 100; i++) {
            if (i % 3 === 0) {
                console.log(i)
            }
        }


    </script>
</body>
</html>
