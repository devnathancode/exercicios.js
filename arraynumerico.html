<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array numerado</title>
</head>
<body>
    <script>
        let array = [12, 8, 15, 8, 20, 15, 30, 8];

        function arraynumerado() {
        for(let num of array) {
            let naorepete = [];
            let repetidos = [];

            if (num === array) {
                naorepete.includes(array);
            } else {
                repetidos.push(array);
            }
        }
    }
    console.log(arraynumerado(repetidos))

    </script>
</body>
</html>
