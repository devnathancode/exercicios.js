<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>temperatura</title>
</head>
<body>
    <script>
        let temp = 60

        if (temp <= 15) {
            alert('o clima esta frio')
        }
        else if (temp > 15 && temp < 30) {
            alert("o clima esta agradavel")
        }
        else {
            alert('o clima esta quente')
        }

    </script>



</body>
</html>
