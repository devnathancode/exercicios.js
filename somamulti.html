<body>
    <script>
        let num1 = Number(prompt('digite um numero'));
        let num2 = Number(prompt('digite outro numero'));
        let total;

        if (num1 === num2) {
            total = num1 + num2;
        } else {
            total = num1 * num2;
        }
        alert(total)

        
    </script>
