<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imprimir antecessor e sucessor</title>
</head>
<body>
    <script>
        let num = Number(prompt('digite um numero'));
        let sucessor = alert(num + 1);
        let antecessor = alert(num - 1);
    </script>
</body>
