<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verificar se tem frete ou nao</title>
</head>
<body>
    <script>
        let prod1 = 50
        let quant = 1
        let total = prod1 * quant

        if (total >= 100) {
            alert('voce nao pagara um frete')
        } else {
            alert('voce pagara um frete de 10 reais')
        }


    </script>
</body>
</html>
