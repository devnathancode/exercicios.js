<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ver todos os numeros pares de 1 a 200</title>
</head>
<body>
    <script>
        for(let i = 1; i <= 200; i++) {
            if (i % 2 === 0) {
                console.log(i);
            }
        }



    </script>
</body>
</html>
