<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>salario minimo</title>
</head>
<body>
    <script>
        let salariousuario = Number(prompt('digite seu salario'));
        let salariominimo = 1621;
        let salariocalculado = salariousuario / salariominimo;

        alert(`cabem ${salariocalculado.toFixed(2)} salarios minimos`);
    </script>
</body>
</html>
