<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>funcao, retornar numero maior</title>
</head>
<body>
    <script>
        let maiorNumero = (num1, num2) => {
            if (num1 >= num2) return num1
            else return num2
        }
        console.log(maiorNumero(1, 2))


    </script>
</body>
</html>
