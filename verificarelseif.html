<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verificar nota aluno</title>
</head>
<body>
    <script>
        let nota = 10

        if (nota >= 9 ) {
            alert('A')
        }
        if (nota >= 7 && nota < 9) {
            alert('B')
        }
        if (nota >= 5 && nota < 7) {
            alert('C')
        }
        if (nota < 5) {
            alert('D')
        }


    </script>
</body>
</html>
