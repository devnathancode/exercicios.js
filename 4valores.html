<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 valores</title>
</head>
<body>
    <script>
        function valores(a, b, c, d) {
            if (a >= b) {
                return c + d
            } else {
                return c - d
            }
        }
        console.log(valores(1, 2, 3, 8))


    </script>
</body>
</html>
