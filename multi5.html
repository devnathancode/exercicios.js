    <title>verificar se e multiplo de 5</title>
</head>
<body>
    <script>
        let num1 = 31

        if (num1 % 5 === 0) {
            alert('esse numero e multiplo de 5')
        } else {
            alert('esse numero nao e multiplo de 5')
        }


    </script>
