<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ver quantos pares existem entre 1 e 50</title>
</head>
<body>
    <script>
        let quant = 0
        for (let i = 2; i <= 50; i += 2){
            quant++
        }
        console.log(quant)
    </script>
</body>
</html>
