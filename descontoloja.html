<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desconto na loja</title>
</head>
<body>
    <script>
        let valor = 2;
        let desconto = 0.10
        let result = valor - (valor * desconto)

        if (valor >= 100) {
            console.log('recebera o desconto de 10%, o total da compra e:R$ ' + result);
        } else {
            console.log('desconto nao sera aplicado, o valor da sua compra e R$ ' + valor);
        }
    </script>
</body>
</html>
