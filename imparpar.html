<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verificador de numero impar ou par</title>
</head>
<body>
    <script>
        let num1 = 4

        if (num1 %2 === 0) {
            alert('par')
        } else {
            alert('impar')
        }
    </script>
</body>
</html>
