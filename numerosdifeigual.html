<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>numeros iguais ou diferentes</title>
</head>
<body>
    <script>
        function numeros(n1, n2, n3) {
            if (n1 === n2 && n1 === n3) {
                return 'todos iguais';
            } else if (n1 !== n2 || n1 !== n3) {
                return 'um numero n esta igual';
            } else if (n1 === n2 && n2 === n3){
                return 'nenhum numero igual';
            }
        }
        console.log(numeros(3, 6, 5))


    </script>
</body>
</html>
