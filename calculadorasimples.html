<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora simples</title>
</head>
<body>
    <script>
        let num1 = 30
        let num2 = 2
        let ope = '+'
        let soma = num1 + num2
        let menos = num1 - num2
        let div = num1 / num2
        let mult = num1 * num2

        if (ope === '+') {
            alert(soma)
        }
        if (ope === '-') {
            alert(menos)
        }
        if (ope === '/') {
            alert(div)
        }
        if (ope === '*') {
            alert(mult)
        }
    </script>
</body>
</html>
